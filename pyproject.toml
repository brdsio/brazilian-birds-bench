[project]
name = "brazilian-birds-bench"
version = "1.0.0"
description = "A benchmark of LLM knowledge on Brazilian bird names (PT -> EN), built on the CBRO checklist."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Flavio Duarte" }]
keywords = ["llm", "benchmark", "birds", "ornithology", "brazil", "cbro", "ebird", "multilingual"]

dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bbb = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
